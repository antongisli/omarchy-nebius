name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate manifest and syntax
        run: |
          python3 -m json.tool manifest.json >/dev/null
          for script in bin/* tools/capture-previews; do bash -n "$script"; done
          python3 -m compileall -q libexec tests tools
      - name: Run tests without cloud access
        run: python3 -m unittest discover -s tests -v
      - name: Fetch unmodified Omarchy for standalone removal tests
        run: |
          git init "$RUNNER_TEMP/omarchy-removal-test"
          git -C "$RUNNER_TEMP/omarchy-removal-test" remote add origin https://github.com/omacom/omarchy.git
          git -C "$RUNNER_TEMP/omarchy-removal-test" fetch --depth=1 origin 31bd80daa4613ffdee995ac27467fce5a2990806
          git -C "$RUNNER_TEMP/omarchy-removal-test" checkout --detach FETCH_HEAD
      - name: Verify removal without upstream cleanup hooks
        env:
          NEBIUS_TEST_OMARCHY_LEGACY_SOURCE: ${{ runner.temp }}/omarchy-removal-test
        run: python3 -m unittest discover -s tests -p test_omarchy_cleanup.py -v
